name: Daily report

on:
  schedule:
    # 00:30 UTC is 07:30 WIB. GitHub may start a run a few minutes late.
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install requests
        run: pip install requests==2.34.2

      - name: Build the report
        id: report
        continue-on-error: true
        env:
          SECTORS_API_KEY: ${{ secrets.SECTORS_API_KEY }}
        run: python3 daily_report.py

      - name: Save the report, log and price files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- reports logs data
          git diff --cached --quiet || git commit -m "Add daily report"
          git pull --rebase
          git push

      - name: Show a failed run as failed
        if: steps.report.outcome == 'failure'
        run: exit 1
